<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>

<body>

  <main class="container">
    <section class="content">
      <img class="content__image" src="./assets/images/illustration-article.svg" alt="Section image" width="1440"
        height="960">

      <span class="content__badge">Learning</span>

      <div class="content__date">Published <date>21 Dec 2023</date>
      </div>

      <h1 class="content__title">HTML & CSS foundations</h1>

      <p class="content__description">These languages are the backbone of every website, defining structure, content,
        and presentation.</p>

      <div class="content-author">
        <img src="./assets/images/image-avatar.webp" alt="Author image" width="65" height="65"
          class="content-author__image">
        Greg Hooper
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/gabrielgoisandrade" target="_blank">Gabriel Gois Andrade</a>.
  </footer>
</body>

</html>
