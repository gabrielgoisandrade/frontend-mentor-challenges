<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./font.css">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

  </style>
</head>

<body>
  <main>
    <section class="content">

      <div class="content-dev">
        <img class="content-dev__avatar" src="./assets/images/avatar-jessica.jpeg" width="176" height="176"
          alt="Jessica Randall, developer">
        <div>
          <h1 class="content-dev__name">Jessica Randall</h1>
          <h2 class="content-dev__location">London, United Kingdom</h2>
        </div>
        <p class="content-dev__quote">"Front-end developer and avid reader."</p>
      </div>

      <nav>
        <ul class="content-links">
          <li>
            <a class="content-links__link" href="#">GitHub</a>
          </li>

          <li>
            <a class="content-links__link" href="#">Frontend Mentor</a>
          </li>

          <li>
            <a class="content-links__link" href="#">LinkedIn</a>
          </li>

          <li>
            <a class="content-links__link" href="#">Twitter</a>
          </li>

          <li>
            <a class="content-links__link" href="#">Instagram</a>
          </li>
        </ul>
      </nav>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/gabrielgoisandrade">Gabriel Gois Andrade</a>.
  </footer>
</body>

</html>
